name: tests

# El README promete macOS, Linux y Windows con Python 3.9 o superior. Esto lo
# comprueba en vez de suponerlo: el bloqueo de ejecución única, la codificación
# de la salida y las reglas del .gitignore se comportan distinto en cada sistema.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin fail-fast: si un sistema falla, interesa ver también los otros.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          # Sin 3.9 en macOS: macos-latest es arm64 y no tiene ese build, y los
          # runners macos-13 (x86_64, que sí lo tienen) ya no se asignan — la
          # tarea quedaba en cola para siempre y la ejecución nunca terminaba.
          # Python 3.9 queda cubierto igual en Ubuntu y Windows, que es donde
          # vive el código específico de cada sistema.
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Sin `pip install`: los --self-test son verificaciones sin conexión y
      # solo usan la biblioteca estándar. requests y playwright se importan
      # dentro de las funciones que los necesitan, no al cargar el módulo.
      - name: Archivador
        run: python archiver.py --self-test

      - name: Sincronización con NotebookLM
        run: python notebooklm_sync.py --self-test
